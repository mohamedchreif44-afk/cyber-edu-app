<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Edu App - Hacker Mode</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="terminal">
    <div class="header">
      <h1>🧠 Cyber Edu Terminal</h1>
      <p class="subtitle">تعلم القرصنة الأخلاقية بأسلوب الهاكر الحقيقي 💻</p>
    </div>

    <div class="menu">
      <button onclick="openLesson('intro')">مقدمة في الأمن السيبراني</button>
      <button onclick="openLesson('network')">أمن الشبكات</button>
      <button onclick="openLesson('web')">اختراق الويب</button>
      <button onclick="openLesson('tools')">أدوات الهكر الأخلاقي</button>
    </div>

    <div id="lessonScreen" class="lesson-screen hidden">
      <button class="close-btn" onclick="closeLesson()">×</button>
      <div id="lessonContent" class="lesson-content"></div>
    </div>

    <footer>
      <p>© 2025 <strong>By Islam — Founder & Developer</strong> | Cyber Edu App</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
