<!DOCTYPE html>
<html lang="ar">
<head>

  <main>

      <h2>اختر درسًا للبدء</h2>
      <p>اضغط على أحد الدروس في الأعلى لعرض المحتوى.</p>
    </section>
  </main>

  <footer>
    <p>🚀 صُمم بواسطة <strong>Islam</strong> | نسخة تجريبية</p>
  </footer>

  <script src="app.js"></script>
